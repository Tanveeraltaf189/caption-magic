name: Build Web App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
    
    - name: Install dependencies
      run: pnpm install
    
    - name: Build web app
      run: pnpm --filter ./apps/studio build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: caption-magic-web-build
        path: apps/studio/dist/

    - name: Create release
      if: success()
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: build-${{ github.run_number }}
        release_name: Caption Magic Build ${{ github.run_number }}
        body: Web build successful. Download artifacts to use with Capacitor.
