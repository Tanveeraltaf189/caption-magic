name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
    
    - name: Install dependencies
      run: pnpm install
    
    - name: Build web app
      run: pnpm --filter ./apps/studio build
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    
    - name: Setup Android SDK
      run: |
        mkdir -p $HOME/.android/sdk
        cd $HOME/.android/sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477014_latest.zip
        unzip -q commandlinetools-linux-9477014_latest.zip
        rm commandlinetools-linux-9477014_latest.zip
    
    - name: Accept Android licenses
      run: |
        export ANDROID_HOME=$HOME/.android/sdk
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"
    
    - name: Build APK
      run: |
        export ANDROID_HOME=$HOME/.android/sdk
        cd apps/studio/android
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: caption-magic-apk
        path: apps/studio/android/app/build/outputs/apk/debug/app-debug.apk
